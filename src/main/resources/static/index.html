<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Historial de operaciones | Lab Modernización</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="header">
    <span class="header__logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94a7.5 7.5 0 0 0 .05-.94 7.5 7.5 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54a7.3 7.3 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.5 7.5 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.39 1.05.7 1.63.94l.36 2.54a.5.5 0 0 0 .49.42h3.8a.5.5 0 0 0 .49-.42l.36-2.54a7.3 7.3 0 0 0 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
    </span>
    <span class="header__title">Lab Modernización</span>
    <span class="header__module">Reportes</span>
  </header>

  <main class="main">
    <h1 class="page-title">Historial de operaciones</h1>
    <p class="page-subtitle">Trazabilidad de las operaciones críticas del sistema.</p>

    <!-- Filtros -->
    <form id="filtros" class="filters" novalidate>
      <div>
        <label for="aud-desde" class="label">Desde</label>
        <input id="aud-desde" type="date" class="input" />
      </div>
      <div>
        <label for="aud-hasta" class="label">Hasta</label>
        <input id="aud-hasta" type="date" class="input" />
      </div>
      <div>
        <label for="aud-usuario" class="label">Usuario</label>
        <div class="select-wrap">
          <select id="aud-usuario" class="input select">
            <option value="">Todos</option>
          </select>
          <svg class="select-wrap__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
      <button type="submit" class="button">Consultar</button>
    </form>

    <p id="error" role="alert" class="error" hidden></p>

    <div class="card">
      <!-- Tabla (tablet y escritorio) -->
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Fecha y hora</th>
              <th>Usuario</th>
              <th>Operación</th>
              <th>Requerimiento</th>
              <th>Detalle</th>
            </tr>
          </thead>
          <tbody id="filas"></tbody>
        </table>
      </div>

      <!-- Tarjetas (móvil) -->
      <ul id="tarjetas" class="cards"></ul>
    </div>

    <div class="pagination">
      <p id="resumen" class="pagination__summary"></p>
      <nav id="paginas" class="pagination__nav" aria-label="Paginación"></nav>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
