spring.application.name=osi-reporte

# Solo aplica al ejecutar en local (mvnw spring-boot:run). En WebLogic el puerto y el
# context root los definen el servidor y WEB-INF/weblogic.xml.
server.port=${SERVER_PORT:8092}
server.servlet.context-path=/osi-reporte
server.error.include-stacktrace=never

# Conexión local a Oracle (misma BD que osi-back). En WebLogic se usa el perfil "weblogic"
# (application-weblogic.properties), que toma el DataSource JNDI del servidor.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//10.0.0.19:1521/bdsph01}
spring.datasource.username=${DB_USERNAME:aprendizaje}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
